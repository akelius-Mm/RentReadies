# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: RRScan
options:
  bundleIdPrefix: com.rentreadies
  deploymentTarget:
    iOS: "17.0"
targets:
  RRScan:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: RR Scan
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: RR Scan uses the camera and LiDAR sensor to measure rooms.
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        CFBundleURLTypes:
          - CFBundleURLName: com.rentreadies.scan
            CFBundleURLSchemes: [rentreadies-scan]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rentreadies.scan
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Set your Apple team in Xcode (Signing & Capabilities) or here.
        DEVELOPMENT_TEAM: ""
